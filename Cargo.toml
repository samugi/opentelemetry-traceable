[workspace]
resolver = "2"
members = ["stylus", "stylus-macros", "stylus-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
base64 = "0.23"
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }
leb128 = "0.2"
linkme = "0.3"
opentelemetry = { version = "0.32", features = ["trace"] }
opentelemetry_sdk = { version = "0.32", features = ["trace", "testing"] }
tokio = { version = "1", features = ["full"] }
arc-swap = "1"
smallvec = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
criterion = "0.5"
tracing = "0.1"
tracing-subscriber = "0.3"
tracing-opentelemetry = "0.33"
